name: proxypin
description: ProxyPin
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.4.1+42

environment:
  sdk: '>=3.0.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^2.0.0
  flutter_svg: ^2.5.1
  pointycastle: ^4.0.0
  logger: ^2.8.0
  date_format: ^2.0.9
  # 锁定 0.5.x：0.6 起底层换成 nativeapi 进程级单例，GetCurrent() 用全局 mainWindow 选窗口，
  # 与 desktop_multi_window 的多 engine 隐藏子窗口（hiddenAtLaunch）冲突——子窗口的 show/resize
  # 会错配到主窗口导致新窗口打不开。0.5.x 每个 engine 经 registrar.view.window 各自绑定窗口才正常。
  window_manager: 0.5.2
  # tray_manager 0.8 起托盘改用 nativeapi 原生 API，desktop_tray 直接引用其类型
  nativeapi: ^0.5.9
  nativeapi_flutter: ^0.5.9
  screen_retriever: ^0.2.2
  desktop_multi_window: ^0.3.1
  path_provider: ^2.1.5
  file_picker: ^13.4.1
  mime: ^2.1.0
  proxy_manager: ^0.0.3
  permission_handler: ^13.0.2
  flutter_toastr: ^1.0.3
  share_plus: ^13.3.1
  flutter_js: ^0.8.7
#  flutter_highlight: ^0.7.0
  device_info_plus: ^13.3.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  toastification: ^3.2.2
  get: ^4.7.3
  zstandard: ^1.5.6
  qr_flutter: ^4.1.0
  flutter_qr_reader_plus: ^1.0.6
  brotli: ^0.6.0
  html: ^0.15.7
  xml: ^7.0.1
  ffi: ^2.1.0
  win32audio: ^1.5.0
  scrollable_positioned_list_nic: ^0.0.2
  tray_manager: ^0.8.3
  code_forge: ^11.7.1
  # 语法高亮模式与 atom-one 配色：code_forge 渲染器与旧 SelectableText 高亮都基于它，
  # 共享查看器直接引用其 Mode/主题，显式声明依赖版本与 code_forge 对齐。
  re_highlight: ^0.0.3
  archive: ^4.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# The following section is specific to Flutter packages.
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/certs/ca.crt
    - assets/certs/ca_key.pem
    - assets/icon.png
    - assets/icon.ico
    - assets/icon_foreground.png
    - assets/js/
    - assets/icons/
    - SKILL.md