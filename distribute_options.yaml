output: dist/

# 产物文件名模板（mustache 语法），如 proxypin-macos-1.4.0.dmg
artifact_name: '{{name}}-{{platform}}-{{build_name}}{{#is_installer}}-setup{{/is_installer}}{{#ext}}.{{ext}}{{/ext}}'

releases:
  - name: release
    jobs:
      - name: macos-dmg
        package:
          platform: macos
          target: dmg
          build_args:
            profile: true

      - name: windows-exe
        package:
          platform: windows
          target: exe
          build_args:
            profile: true

      - name: windows-msix
        package:
          platform: windows
          target: msix

      - name: windows-zip
        package:
          platform: windows
          target: zip
